<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Student Productivity Dashboard is a premium study planning workspace for assignments, exams, habits, analytics, and focused sessions."
  />
  <meta name="theme-color" content="#0b1324" />
  <title>Student Productivity Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=2026-05-26-month-plan" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="utils/constants.js?v=2026-05-26-month-plan" defer></script>
  <script src="utils/helpers.js?v=2026-05-26-month-plan" defer></script>
  <script src="utils/date.js?v=2026-05-26-month-plan" defer></script>
  <script src="storage/plannerStorage.js?v=2026-05-26-month-plan" defer></script>
  <script src="components/templates.js?v=2026-05-26-month-plan" defer></script>
  <script src="components/dashboardApp.js?v=2026-05-26-month-plan" defer></script>
  <script src="script.js?v=2026-05-26-month-plan" defer></script>
</head>
<body class="theme-midnight is-booting">
  <div class="app-backdrop">
    <div class="backdrop-orb orb-a" aria-hidden="true"></div>
    <div class="backdrop-orb orb-b" aria-hidden="true"></div>
    <div class="backdrop-grid" aria-hidden="true"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar glass-panel" id="sidebarPanel" aria-label="Primary navigation">
      <div id="sidebarContent" class="sidebar-content">
        <div class="skeleton-block skeleton-title"></div>
        <div class="skeleton-stack">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
        <div class="skeleton-stack">
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
          <div class="skeleton-pill"></div>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar glass-panel">
        <div class="topbar-left">
          <button type="button" class="chip-button" id="sidebarToggleBtn" aria-label="Toggle sidebar">
            Menu
          </button>
          <div class="command-hint">
            <span class="eyebrow">Shortcuts</span>
            <strong>Press ? for commands</strong>
          </div>
        </div>

        <div class="topbar-actions">
          <button type="button" class="chip-button" id="jumpPlannerBtn">Add work</button>
          <button type="button" class="chip-button" id="focusModeBtn">Focus mode</button>
          <button type="button" class="chip-button" id="notificationBtn">Notifications</button>
          <button type="button" class="chip-button" id="themeCycleBtn">Theme</button>
          <button type="button" class="chip-button" id="exportBtn">Export</button>
          <button type="button" class="chip-button" id="importBtn">Import</button>
        </div>
      </header>

      <main class="dashboard-grid" id="dashboardRoot">
        <section class="hero-panel glass-panel" id="section-overview" aria-labelledby="overviewTitle">
          <div class="section-skeleton">
            <div class="skeleton-block skeleton-banner"></div>
            <div class="skeleton-grid skeleton-cards">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
        </section>

        <section class="workspace-panel glass-panel" id="section-planner" aria-labelledby="plannerTitle">
          <div class="section-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-board">
              <div class="skeleton-card tall"></div>
              <div class="skeleton-card tall"></div>
              <div class="skeleton-card tall"></div>
            </div>
          </div>
        </section>

        <section class="workspace-panel glass-panel" id="section-habits" aria-labelledby="habitsTitle">
          <div class="section-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-grid skeleton-cards">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
        </section>

        <section class="workspace-panel glass-panel" id="section-analytics" aria-labelledby="analyticsTitle">
          <div class="section-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-card wide"></div>
          </div>
        </section>

        <section class="workspace-panel glass-panel" id="section-focus" aria-labelledby="focusTitle">
          <div class="section-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-grid skeleton-cards">
              <div class="skeleton-card"></div>
              <div class="skeleton-card"></div>
            </div>
          </div>
        </section>

        <section class="workspace-panel glass-panel" id="section-settings" aria-labelledby="settingsTitle">
          <div class="section-skeleton">
            <div class="skeleton-line"></div>
            <div class="skeleton-stack">
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
              <div class="skeleton-line"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="true"></div>
  <input type="file" id="importInput" accept=".json,application/json" hidden />
</body>
</html>
